<script>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: ModalJS.html
 * ==========================================================
 */

let telefoneEditando = null;

function normalizarChaveModal(v){ return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]/g,"").toUpperCase(); }
function preencherSelectModal(id, valores, placeholder){
  var sel=document.getElementById(id); if(!sel) return;
  var atual=sel.value;
  sel.textContent="";
  var opt0=document.createElement("option"); opt0.value=""; opt0.textContent=placeholder||"Selecione"; sel.appendChild(opt0);
  Array.from(valores||[]).sort(function(a,b){return String(a).localeCompare(String(b),"pt-BR");}).forEach(function(v){
    var o=document.createElement("option"); o.value=String(v); o.textContent=String(v); sel.appendChild(o);
  });
  // restore if still valid
  var opts=Array.from(sel.options).map(function(o){return o.value;});
  if(atual && opts.indexOf(atual)!==-1) sel.value=atual;
}
function obterMicrorregioesModal(){
  var set=new Set();
  var allowed = (typeof comarcasPermitidasDoUsuario==="function") ? comarcasPermitidasDoUsuario() : null;
  var src = (typeof todosTelefones!=="undefined" && Array.isArray(todosTelefones)) ? todosTelefones : [];
  src.forEach(function(it){
    var micro=String(it.microrregiao||it.Microrregiao||"").trim();
    var comarca=String(it.comarca||it.Comarca||"").trim();
    if(!micro) return;
    if(allowed!==null && comarca){
      var ck=normalizarChaveModal(comarca);
      if(allowed.indexOf(ck)===-1) return;
    }
    set.add(micro);
  });
  // fallback via comarcasPorMicrorregiao
  if(set.size===0 && typeof comarcasPorMicrorregiao!=="undefined"){
    Object.keys(comarcasPorMicrorregiao).forEach(function(k){ set.add(k); });
  }
  return Array.from(set);
}
function obterComarcasModal(micro){
  var set=new Set();
  var allowed2 = (typeof comarcasPermitidasDoUsuario==="function") ? comarcasPermitidasDoUsuario() : null;
  var src2 = (typeof todosTelefones!=="undefined" && Array.isArray(todosTelefones)) ? todosTelefones : [];
  var filtroMicro = micro ? normalizarChaveModal(micro) : "";
  src2.forEach(function(it){
    var m=String(it.microrregiao||it.Microrregiao||"").trim();
    var c=String(it.comarca||it.Comarca||"").trim();
    if(!c) return;
    if(filtroMicro && normalizarChaveModal(m)!==filtroMicro) return;
    if(allowed2!==null){
      var ck2=normalizarChaveModal(c);
      if(allowed2.indexOf(ck2)===-1) return;
    }
    set.add(c);
  });
  if(set.size===0 && micro && typeof comarcasPorMicrorregiao!=="undefined" && comarcasPorMicrorregiao[micro]){
    comarcasPorMicrorregiao[micro].forEach(function(c){
      if(allowed2===null || allowed2.indexOf(normalizarChaveModal(c))!==-1) set.add(c);
    });
  }
  return Array.from(set);
}
function obterSetoresModal(micro, comarca){
  var set=new Set();
  var src3 = (typeof todosTelefones!=="undefined" && Array.isArray(todosTelefones)) ? todosTelefones : [];
  var fm = micro ? normalizarChaveModal(micro) : "";
  var fc = comarca ? normalizarChaveModal(comarca) : "";
  src3.forEach(function(it){
    var m=String(it.microrregiao||it.Microrregiao||"").trim();
    var c=String(it.comarca||it.Comarca||"").trim();
    var s=String(it.setor||it.Setor||"").trim();
    if(!s) return;
    if(fm && normalizarChaveModal(m)!==fm) return;
    if(fc && normalizarChaveModal(c)!==fc) return;
    set.add(s);
  });
  if(set.size===0 && comarca && typeof setoresPorComarca!=="undefined" && setoresPorComarca[comarca]){
    setoresPorComarca[comarca].forEach(function(s){ set.add(s); });
  }
  return Array.from(set);
}
function popularModalMicrorregioes(preservar){
  var vals=obterMicrorregioesModal();
  preencherSelectModal("telefone-microrregiao", vals, "Selecione");
  if(preservar){
    var sel=document.getElementById("telefone-microrregiao");
    if(sel){
      var opts=Array.from(sel.options).map(function(o){return o.value;});
      if(opts.indexOf(preservar)!==-1) sel.value=preservar;
      else {
        var o=document.createElement("option"); o.value=preservar; o.textContent=preservar; sel.appendChild(o); sel.value=preservar;
      }
    }
  }
}
function popularModalComarcas(micro, preservar){
  var vals=obterComarcasModal(micro||"");
  preencherSelectModal("telefone-comarca", vals, "Selecione");
  if(preservar){
    var sel2=document.getElementById("telefone-comarca");
    if(sel2){
      var opts2=Array.from(sel2.options).map(function(o){return o.value;});
      if(opts2.indexOf(preservar)!==-1) sel2.value=preservar;
      else { var o2=document.createElement("option"); o2.value=preservar; o2.textContent=preservar; sel2.appendChild(o2); sel2.value=preservar; }
    }
  }
}
function popularModalSetores(micro, comarca, preservar){
  var vals=obterSetoresModal(micro||"", comarca||"");
  preencherSelectModal("telefone-setor", vals, "Selecione");
  if(preservar){
    var sel3=document.getElementById("telefone-setor");
    if(sel3){
      var opts3=Array.from(sel3.options).map(function(o){return o.value;});
      if(opts3.indexOf(preservar)!==-1) sel3.value=preservar;
      else { var o3=document.createElement("option"); o3.value=preservar; o3.textContent=preservar; sel3.appendChild(o3); sel3.value=preservar; }
    }
  }
}
function atualizarVisibilidadeTipo(){
  var tipoEl=document.getElementById("telefone-tipo");
  var tipo= tipoEl ? String(tipoEl.value||"").trim() : "";
  var mapTipo={ "Telefone":"grupo-telefone-numero", "Ramal":"grupo-telefone-ramal", "WhatsApp":"grupo-telefone-whatsapp", "E-mail":"grupo-telefone-email" };
  Object.keys(mapTipo).forEach(function(k){
    var gid=mapTipo[k];
    var el=document.getElementById(gid);
    if(!el) return;
    if(k===tipo) el.classList.remove("hidden");
    else { el.classList.add("hidden"); }
  });
  // limpa campos ocultos para garantir single
  if(tipo!=="Telefone"){ var e1=document.getElementById("telefone-numero"); if(e1) e1.value=""; }
  if(tipo!=="Ramal"){ var e2=document.getElementById("telefone-ramal"); if(e2) e2.value=""; }
  if(tipo!=="WhatsApp"){ var e3=document.getElementById("telefone-whatsapp"); if(e3) e3.value=""; }
  if(tipo!=="E-mail"){ var e4=document.getElementById("telefone-email"); if(e4) e4.value=""; }
}
function onModalTipoChange(){ atualizarVisibilidadeTipo(); }
function onModalMicrorregiaoChange(){
  var micro=document.getElementById("telefone-microrregiao")?.value||"";
  popularModalComarcas(micro);
  popularModalSetores(micro, "");
  atualizarVisibilidadeTipo();
}
function onModalComarcaChange(){
  var micro=document.getElementById("telefone-microrregiao")?.value||"";
  var comarca=document.getElementById("telefone-comarca")?.value||"";
  popularModalSetores(micro, comarca);
}

function abrirModalNovoTelefone() {
  telefoneEditando = null;

  limparFormularioTelefone();
  limparMensagemModal();

  const titulo =
    document.getElementById(
      "modal-titulo"
    );

  if (titulo) {
    titulo.textContent =
      "Adicionar novo contato";
  }

  const modal =
    document.getElementById(
      "modal-telefone"
    );

  if (modal) {
    modal.classList.remove(
      "hidden"
    );

    modal.style.display =
      "flex";
  }
}

function editarTelefone(id) {
  abrirEditarTelefone(id);
}

function preencherFormularioTelefone(telefone) {
  if (!telefone) {
    return;
  }

  // Pre-popula cascata antes de setar valores
  try{
    var microPre = String((telefone.microrregiao||telefone.Microrregiao||telefone.MICRORREGIAO||"")).trim();
    var comarcaPre = String((telefone.comarca||telefone.Comarca||telefone.COMARCA||"")).trim();
    var setorPre = String((telefone.setor||telefone.Setor||telefone.SETOR||"")).trim();
    var tipoPre = String((telefone.tipo||telefone.Tipo||telefone.TIPO||"")).trim();
    popularModalMicrorregioes(microPre);
    popularModalComarcas(microPre, comarcaPre);
    popularModalSetores(microPre, comarcaPre, setorPre);
    // tipo visibilidade
    var tipoSel=document.getElementById("telefone-tipo");
    if(tipoSel && tipoPre) tipoSel.value=tipoPre;
    atualizarVisibilidadeTipo();
    if(tipoSel && tipoPre) tipoSel.value=tipoPre;
  }catch(ePre){}

  const valor = (
    campo,
    ...alternativos
  ) => {
    const nomes = [
      campo,
      ...alternativos
    ];

    for (const nome of nomes) {
      if (
        telefone[nome] !==
          undefined &&
        telefone[nome] !==
          null
      ) {
        return telefone[nome];
      }
    }

    return "";
  };

  setValorCampo(
    "telefone-id",
    valor("ID", "id")
  );

  setValorCampo(
    "telefone-microrregiao",
    valor(
      "microrregiao",
      "Microrregiao"
    )
  );

  setValorCampo(
    "telefone-comarca",
    valor(
      "comarca",
      "Comarca"
    )
  );

  setValorCampo(
    "telefone-setor",
    valor(
      "setor",
      "Setor"
    )
  );

  setValorCampo(
    "telefone-tipo",
    valor(
      "tipo",
      "Tipo"
    )
  );

  setValorCampo(
    "telefone-numero",
    valor(
      "numero",
      "Numero"
    )
  );

  setValorCampo(
    "telefone-ramal",
    valor(
      "ramal",
      "Ramal"
    )
  );

  setValorCampo(
    "telefone-whatsapp",
    valor(
      "whatsapp",
      "Whatsapp",
      "WhatsApp"
    )
  );

  setValorCampo(
    "telefone-email",
    valor(
      "email",
      "EMAIL",
      "E_MAIL",
      "E-mail"
    )
  );

  setValorCampo(
    "telefone-endereco",
    valor(
      "endereco",
      "ENDERECO",
      "Endereco",
      "Endereço"
    )
  );

  setValorCampo(
    "telefone-status",
    valor(
      "status",
      "Status"
    ) || "ATIVO"
  );

  setValorCampo(
    "telefone-observacao",
    valor(
      "observacao",
      "Observacao"
    )
  );
}

function limparFormularioTelefone() {
  try{ atualizarVisibilidadeTipo(); }catch(e){}
  const campos = [
    "telefone-id",
    "telefone-microrregiao",
    "telefone-comarca",
    "telefone-setor",
    "telefone-tipo",
    "telefone-numero",
    "telefone-ramal",
    "telefone-whatsapp",
    "telefone-email",
    "telefone-endereco",
    "telefone-observacao"
  ];

  campos.forEach(id => {
    setValorCampo(id, "");
  });

  setValorCampo(
    "telefone-status",
    "ATIVO"
  );
}

function fecharModalTelefone() {
  limparMensagemModal();

  const modal =
    document.getElementById(
      "modal-telefone"
    );

  if (modal) {
    modal.classList.add(
      "hidden"
    );

    modal.style.display =
      "none";
  }

  telefoneEditando = null;
}

function obterDadosFormularioTelefone() {
  const idCampo =
    getValorCampo(
      "telefone-id"
    );

  const idAtual =
    idCampo ||
    telefoneEditando ||
    "";

  const limparCampo = id => {
    const valor =
      getValorCampo(id)
        .trim();

    return valor === "-"
      ? ""
      : valor;
  };

  var tipoSel = limparCampo("telefone-tipo");
  var rawNumero = limparCampo("telefone-numero");
  var rawRamal = limparCampo("telefone-ramal");
  var rawWhatsapp = limparCampo("telefone-whatsapp");
  var rawEmail = limparCampo("telefone-email");
  // Single contact enforcement: só mantém o campo do Tipo selecionado
  var numeroF="", ramalF="", whatsappF="", emailF="";
  if(tipoSel==="Telefone") numeroF=rawNumero;
  else if(tipoSel==="Ramal") ramalF=rawRamal;
  else if(tipoSel==="WhatsApp") whatsappF=rawWhatsapp;
  else if(tipoSel==="E-mail") emailF=rawEmail;

  return {
    ID: idAtual,
    id: idAtual,

    microrregiao:
      limparCampo("telefone-microrregiao"),

    comarca:
      limparCampo("telefone-comarca"),

    setor:
      limparCampo("telefone-setor"),

    tipo: tipoSel,

    numero: numeroF,

    ramal: ramalF,

    whatsapp: whatsappF,

    email: emailF,

    endereco:
      limparCampo("telefone-endereco"),

    status:
      limparCampo("telefone-status"),

    observacao:
      limparCampo("telefone-observacao")
  };
}

function exibirNotificacao(
  mensagem,
  tipo
) {
  const elemento =
    document.getElementById(
      "modal-mensagem-erro"
    );

  if (!elemento) {
    return;
  }

  const sucesso =
    tipo === "success";

  elemento.textContent =
    (
      sucesso
        ? "✅ "
        : "⚠️ "
    ) +
    String(
      mensagem || ""
    );

  elemento.style.backgroundColor =
    sucesso
      ? "#d1e7dd"
      : "#f8d7da";

  elemento.style.color =
    sucesso
      ? "#0f5132"
      : "#842029";

  elemento.style.borderColor =
    sucesso
      ? "#badbcc"
      : "#f5c2c7";

  elemento.classList.remove(
    "hidden"
  );
}

function limparMensagemModal() {
  const elemento =
    document.getElementById(
      "modal-mensagem-erro"
    );

  if (!elemento) {
    return;
  }

  elemento.textContent =
    "";

  elemento.classList.add(
    "hidden"
  );
}

function validarFormularioTelefone(
  dados
) {
  const faltantes = [];

  if (!dados.microrregiao) {
    faltantes.push(
      "Microrregião"
    );
  }

  if (!dados.comarca) {
    faltantes.push(
      "Comarca"
    );
  }

  if (!dados.setor) {
    faltantes.push(
      "Setor"
    );
  }

  if (!dados.tipo) {
    faltantes.push(
      "Tipo"
    );
  }

  if (!dados.status) {
    faltantes.push(
      "Status"
    );
  }

  if (faltantes.length > 0) {
    exibirNotificacao(
      "Por favor, preencha os campos obrigatórios: " +
        faltantes.join(", ") +
        ".",
      "error"
    );

    return false;
  }

  const contatos = [dados.numero, dados.ramal, dados.whatsapp, dados.email].filter(function(v){ return String(v||"").trim() !== ""; });
  if (contatos.length === 0) {
    exibirNotificacao(
      "Preencha ao menos um meio de contato: Telefone, Ramal, WhatsApp ou E-mail.",
      "error"
    );
    return false;
  }
  if (contatos.length > 1) {
    exibirNotificacao(
      "Informe apenas um tipo de contato por vez: Telefone, Ramal, WhatsApp ou E-mail.",
      "error"
    );
    return false;
  }

  return true;
}

function atualizarListaLocalTelefone(
  registro,
  modoEdicao,
  idEdicao
) {
  if (
    typeof listaTelefones ===
      "undefined" ||
    !Array.isArray(
      listaTelefones
    )
  ) {
    return;
  }

  const idRegistro =
    String(
      registro.ID ||
      registro.id ||
      idEdicao ||
      ""
    ).trim();

  if (modoEdicao) {
    const indice =
      listaTelefones.findIndex(
        item => {
          return (
            obterIdTelefone(item) ===
            String(idEdicao)
              .trim()
          );
        }
      );

    if (indice >= 0) {
      listaTelefones[indice] =
        Object.assign(
          {},
          listaTelefones[indice],
          registro
        );
    }

    if (
      typeof todosTelefones !== "undefined" &&
      Array.isArray(todosTelefones)
    ) {
      const idx2 =
        todosTelefones.findIndex(item =>
          String(item.ID || item.id || "").trim() === String(idEdicao).trim()
        );

      if (idx2 >= 0) {
        todosTelefones[idx2] = Object.assign({}, todosTelefones[idx2], registro);
      }
    }
  } else if (idRegistro) {
    listaTelefones.push(registro);

    if (
      typeof todosTelefones !== "undefined" &&
      Array.isArray(todosTelefones)
    ) {
      todosTelefones.push(Object.assign({}, registro));
    }
  }

  try{ if(typeof processarDados==="function") processarDados(); }catch(e){}

  if (
    typeof carregarFiltros ===
    "function"
  ) {
    carregarFiltros();
  }

  if (
    typeof atualizarTabelaComFiltros ===
    "function"
  ) {
    atualizarTabelaComFiltros();
  } else if (
    typeof renderizarTabela ===
    "function"
  ) {
    renderizarTabela(
      listaTelefones
    );
  }
}

function salvarTelefone() {
  limparMensagemModal();

  const dados =
    obterDadosFormularioTelefone();

  if (
    !validarFormularioTelefone(
      dados
    )
  ) {
    return;
  }

  const comarcaFormulario =
    String(
      dados.comarca || ""
    ).trim();

  if (
    typeof podeEditarComarca ===
      "function" &&
    !podeEditarComarca(
      comarcaFormulario
    )
  ) {
    exibirNotificacao(
      "Você só pode salvar telefones nas suas comarcas.",
      "error"
    );

    return;
  }

  const modoEdicao =
    Boolean(
      telefoneEditando
    );

  const idEdicao =
    String(
      telefoneEditando || ""
    ).trim();

  const botao =
    document.getElementById(
      "btn-salvar-telefone"
    );

  const textoOriginal =
    botao
      ? botao.textContent
      : "Salvar";

  if (botao) {
    botao.disabled = true;
    botao.textContent =
      "Salvando...";
  }

  const restaurarBotao = () => {
    if (botao) {
      botao.disabled = false;
      botao.textContent =
        textoOriginal ||
        "Salvar";
    }
  };

  const sucesso = resposta => {
    if (
      !resposta ||
      resposta.sucesso !== true ||
      !resposta.dados
    ) {
      restaurarBotao();

      exibirNotificacao(
        resposta &&
        resposta.erro
          ? resposta.erro
          : "Erro ao salvar registro.",
        "error"
      );

      return;
    }

    const registro =
      resposta.dados;

    atualizarListaLocalTelefone(
      registro,
      modoEdicao,
      idEdicao
    );

    exibirNotificacao(
      "Telefone salvo com sucesso!",
      "success"
    );

    setTimeout(() => {
      fecharModalTelefone();
      restaurarBotao();
    }, 800);
  };

  const erro = erroServidor => {
    restaurarBotao();

    exibirNotificacao(
      erroServidor &&
      erroServidor.message
        ? erroServidor.message
        : "Erro interno ao salvar telefone.",
      "error"
    );
  };

  if (modoEdicao) {
    API.atualizarTelefone(
      idEdicao,
      dados,
      sucesso,
      erro
    );
  } else {
    API.criarTelefone(
      dados,
      sucesso,
      erro
    );
  }
}

function abrirEditarTelefone(id) {
  const telefone =
    encontrarTelefone(id);

  if (!telefone) {
    mostrarToast(
      "Telefone não encontrado.",
      "error"
    );

    return;
  }

  if (
    typeof podeEditarComarca ===
      "function" &&
    !podeEditarComarca(
      String(
        telefone.comarca || ""
      ).trim()
    )
  ) {
    mostrarToast(
      "Você só pode editar telefones das suas comarcas.",
      "error"
    );

    return;
  }

  telefoneEditando =
    String(id).trim();

  limparMensagemModal();

  preencherFormularioTelefone(
    telefone
  );

  const titulo =
    document.getElementById(
      "modal-titulo"
    );

  if (titulo) {
    titulo.textContent =
      "Editar contato";
  }

  const modal =
    document.getElementById(
      "modal-telefone"
    );

  if (modal) {
    modal.classList.remove(
      "hidden"
    );

    modal.style.display =
      "flex";
  }
}

function getValorCampo(id) {
  const elemento =
    document.getElementById(id);

  return elemento
    ? String(
        elemento.value || ""
      )
    : "";
}

function setValorCampo(
  id,
  valor
) {
  const elemento =
    document.getElementById(id);

  if (elemento) {
    elemento.value =
      valor === null ||
      valor === undefined
        ? ""
        : valor;
  }
}
</script>

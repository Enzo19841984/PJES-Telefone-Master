<div id="modal-acesso" class="modal hidden">
  <div class="modal-content modal-small">
    <div class="modal-header">
      <h2>Solicitar Acesso Administrativo</h2>
      <button type="button" class="modal-close" onclick="fecharModalAcesso()">×</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="solic-nome">Nome completo *</label>
        <input type="text" id="solic-nome" maxlength="150" required>
      </div>

      <p style="margin: 15px 0 10px;"><strong>Perfil solicitado *</strong></p>

      <label>
        <input type="radio" id="check-gestor-conteudo" name="perfil" value="GESTOR_CONTEUDO" checked>
        Gestor de Conteúdo
      </label>

      <small style="display: block; margin-top: 12px; color: #64748b;">
        Ao enviar, uma solicitação será encaminhada ao Gestor do Sistema para aprovação.
      </small>

      <div id="form-mensagem-erro" class="hidden" style="margin-top: 12px; color: #dc2626;"></div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px;">
        <button type="button" class="btn" onclick="fecharModalAcesso()">Cancelar</button>
        <button type="button" id="btn-enviar-solicitacao" class="btn btn-primary" onclick="enviarSolicitacaoAcesso()">Enviar solicitação</button>
      </div>
    </div>
  </div>
</div>

<script>
function abrirModalAcesso() {
  // Se o utilizador não estiver logado, redireciona para o login
  var email = (usuarioAtual && usuarioAtual.email) ? String(usuarioAtual.email).trim() : "";
  if (!email) {
    fazerLogin();
    return;
  }

  // Utilizador logado – mostra o formulário
  document.getElementById("modal-acesso").classList.remove("hidden");
  document.getElementById("solic-nome").value = "";
  document.getElementById("check-gestor-conteudo").checked = true;
  document.getElementById("form-mensagem-erro").classList.add("hidden");
}

function fecharModalAcesso() {
  document.getElementById("modal-acesso").classList.add("hidden");
}

function enviarSolicitacaoAcesso() {
  var nome = document.getElementById("solic-nome").value.trim();
  if (nome.length < 3) {
    document.getElementById("form-mensagem-erro").innerText = "Informe o seu nome completo.";
    document.getElementById("form-mensagem-erro").classList.remove("hidden");
    return;
  }

  var email = (usuarioAtual && usuarioAtual.email) ? String(usuarioAtual.email).trim() : "";
  if (!email) {
    document.getElementById("form-mensagem-erro").innerText = "Sessão expirada. Faça login novamente.";
    document.getElementById("form-mensagem-erro").classList.remove("hidden");
    return;
  }

  var perfil = "GESTOR_CONTEUDO"; // único perfil solicitável

  var botao = document.getElementById("btn-enviar-solicitacao");
  botao.disabled = true;
  botao.textContent = "Enviando...";

  API.solicitarAcesso(nome, perfil,
    function(res) {
      if (res && res.sucesso) {
        fecharModalAcesso();
        mostrarToast("Solicitação enviada com sucesso!", "success");
      } else {
        document.getElementById("form-mensagem-erro").innerText = res?.erro || "Erro ao enviar.";
        document.getElementById("form-mensagem-erro").classList.remove("hidden");
      }
      botao.disabled = false;
      botao.textContent = "Enviar solicitação";
    },
    function(err) {
      document.getElementById("form-mensagem-erro").innerText = "Falha na comunicação.";
      document.getElementById("form-mensagem-erro").classList.remove("hidden");
      botao.disabled = false;
      botao.textContent = "Enviar solicitação";
    }
  );
}

</script>

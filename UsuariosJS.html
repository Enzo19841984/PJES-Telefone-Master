<script>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: UsuariosJS.html
 * ==========================================================
 */

var comarcasSelecao = [];

function normalizarComarcaKey(valor) {
  return String(valor || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9]/g, "")
    .toLowerCase();
}

function carregarUsuarios() {
  if (
    typeof API === "undefined" ||
    typeof API.listarUsuarios !== "function"
  ) {
    return;
  }

  carregarComarcasParaSelecao();

  API.listarUsuarios(
    function(resposta) {
      if (!resposta || resposta.sucesso !== true) {
        exibirErroUsuarios(
          (resposta && resposta.erro) || "Erro ao carregar usuários."
        );
        return;
      }

      renderizarUsuarios(
        Array.isArray(resposta.dados) ? resposta.dados : []
      );
    },
    function(erro) {
      exibirErroUsuarios(
        (erro && erro.message) || "Falha de comunicação com o servidor."
      );
    }
  );
}

function carregarComarcasParaSelecao() {
  if (
    typeof API !== "undefined" &&
    typeof API.listarComarcas === "function"
  ) {
    API.listarComarcas(
      function(resposta) {
        if (resposta && resposta.sucesso === true && Array.isArray(resposta.dados)) {
          comarcasSelecao = resposta.dados;
        } else {
          comarcasSelecao = comarcasDeTelefonesLocais();
        }
      },
      function() {
        comarcasSelecao = comarcasDeTelefonesLocais();
      }
    );
  } else {
    comarcasSelecao = comarcasDeTelefonesLocais();
  }
}

function comarcasDeTelefonesLocais() {
  var comarcas = {};

  if (
    typeof listaTelefones !== "undefined" &&
    Array.isArray(listaTelefones)
  ) {
    listaTelefones.forEach(function(item) {
      var comarca = String(
        (item && (item.comarca || item.COMARCA)) || ""
      ).trim();

      if (comarca && !comarcas[comarca]) {
        comarcas[comarca] = true;
      }
    });
  }

  return Object.keys(comarcas).sort(function(a, b) {
    return a.localeCompare(b, "pt-BR");
  });
}

/**
 * Seletor de comarcas (menu suspenso com busca + checkboxes).
 * Retorna { elemento, obterValor } — obterValor devolve as
 * comarcas selecionadas separadas por vírgula.
 */
function criarSeletorComarcas(valorInicial) {
  var selecionadas = {};

  String(valorInicial || "")
    .split(/[,;\n|]+/)
    .forEach(function(nome) {
      nome = String(nome || "").trim();
      if (nome) {
        selecionadas[normalizarComarcaKey(nome)] = nome;
      }
    });

  var wrapper = document.createElement("div");
  wrapper.className = "usuario-comarcas-picker";
  wrapper.style.cssText = "position:relative;";

  var botao = document.createElement("button");
  botao.type = "button";
  botao.className = "btn btn-secondary";
  botao.style.cssText =
    "width:100%;padding:6px 8px;font-size:12px;text-align:left;" +
    "white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";

  var painel = document.createElement("div");
  painel.className = "hidden";
  painel.style.cssText =
    "position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;" +
    "background:#ffffff;border:1.5px solid #cbd5e1;border-radius:10px;" +
    "box-shadow:0 12px 28px -10px rgba(15,23,42,0.25);padding:8px;" +
    "max-height:280px;display:flex;flex-direction:column;";

  var busca = document.createElement("input");
  busca.type = "search";
  busca.placeholder = "Buscar comarca...";
  busca.style.cssText =
    "padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;" +
    "font-size:12px;margin-bottom:6px;box-sizing:border-box;width:100%;";

  var lista = document.createElement("div");
  lista.style.cssText = "overflow-y:auto;flex:1;min-height:60px;";

  var rodape = document.createElement("div");
  rodape.style.cssText =
    "display:flex;justify-content:space-between;gap:8px;margin-top:8px;";

  var btnLimpar = document.createElement("button");
  btnLimpar.type = "button";
  btnLimpar.className = "btn btn-danger";
  btnLimpar.textContent = "Limpar";
  btnLimpar.style.cssText = "padding:5px 10px;font-size:11px;";

  var btnFechar = document.createElement("button");
  btnFechar.type = "button";
  btnFechar.className = "btn btn-primary";
  btnFechar.textContent = "OK";
  btnFechar.style.cssText = "padding:5px 14px;font-size:11px;";

  rodape.appendChild(btnLimpar);
  rodape.appendChild(btnFechar);

  painel.appendChild(busca);
  painel.appendChild(lista);
  painel.appendChild(rodape);
  wrapper.appendChild(botao);
  wrapper.appendChild(painel);

  function atualizarBotao() {
    var nomes = Object.keys(selecionadas).map(function(key) {
      return selecionadas[key];
    });

    if (nomes.length === 0) {
      botao.textContent = "Todas as comarcas";
      botao.title = "Sem restrição — pode editar todas as comarcas";
    } else {
      var texto = nomes.join(", ");
      botao.textContent =
        nomes.length + " comarca" + (nomes.length > 1 ? "s" : "") +
        (texto.length > 42 ? ": " + texto.slice(0, 39) + "…" : ": " + texto);
      botao.title = texto;
    }
  }

  function renderizarLista() {
    lista.textContent = "";

    if (comarcasSelecao.length === 0) {
      var aviso = document.createElement("div");
      aviso.style.cssText =
        "padding:10px;font-size:12px;color:#94a3b8;text-align:center;";
      aviso.textContent = "Carregando comarcas...";
      lista.appendChild(aviso);
      return;
    }

    var termo = normalizarComarcaKey(busca.value);

    var filtradas = termo
      ? comarcasSelecao.filter(function(nome) {
          return normalizarComarcaKey(nome).includes(termo);
        })
      : comarcasSelecao.slice();

    if (filtradas.length === 0) {
      var vazio = document.createElement("div");
      vazio.style.cssText =
        "padding:10px;font-size:12px;color:#94a3b8;text-align:center;";
      vazio.textContent = "Nenhuma comarca encontrada";
      lista.appendChild(vazio);
      return;
    }

    filtradas.forEach(function(nome) {
      var label = document.createElement("label");
      label.style.cssText =
        "display:flex;align-items:center;gap:7px;padding:5px 6px;" +
        "border-radius:6px;font-size:12px;cursor:pointer;";

      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = !!selecionadas[normalizarComarcaKey(nome)];

      checkbox.addEventListener("change", function() {
        var chave = normalizarComarcaKey(nome);

        if (checkbox.checked) {
          selecionadas[chave] = nome;
        } else {
          delete selecionadas[chave];
        }

        atualizarBotao();
      });

      var span = document.createElement("span");
      span.textContent = nome;

      label.appendChild(checkbox);
      label.appendChild(span);
      lista.appendChild(label);
    });
  }

  botao.addEventListener("click", function(evento) {
    evento.stopPropagation();

    var fechado = painel.classList.contains("hidden");

    document.querySelectorAll(".usuario-comarcas-picker > div").forEach(function(outro) {
      if (outro !== painel) {
        outro.classList.add("hidden");
      }
    });

    if (fechado) {
      renderizarLista();
      painel.classList.remove("hidden");
    } else {
      painel.classList.add("hidden");
    }
  });

  busca.addEventListener("input", renderizarLista);

  btnLimpar.addEventListener("click", function() {
    selecionadas = {};
    renderizarLista();
    atualizarBotao();
  });

  btnFechar.addEventListener("click", function() {
    painel.classList.add("hidden");
  });

  document.addEventListener("click", function fecharFora(evento) {
    if (!wrapper.contains(evento.target)) {
      painel.classList.add("hidden");
    }
  });

  atualizarBotao();

  return {
    elemento: wrapper,
    obterValor: function() {
      return Object.keys(selecionadas)
        .map(function(key) {
          return selecionadas[key];
        })
        .join(", ");
    }
  };
}

function exibirErroUsuarios(mensagem) {
  var tbody = document.getElementById("corpo-tabela-usuarios");
  if (!tbody) return;

  tbody.textContent = "";

  var tr = document.createElement("tr");
  var td = document.createElement("td");

  td.colSpan = 6;
  td.textContent = "⚠️ " + String(mensagem || "");
  td.style.textAlign = "center";
  td.style.color = "#dc2626";
  td.style.padding = "20px";

  tr.appendChild(td);
  tbody.appendChild(tr);
}

function renderizarUsuarios(lista) {
  var tbody = document.getElementById("corpo-tabela-usuarios");
  if (!tbody) return;

  tbody.textContent = "";

  if (lista.length === 0) {
    var tr = document.createElement("tr");
    var td = document.createElement("td");

    td.colSpan = 6;
    td.textContent = "Nenhum usuário com acesso administrativo cadastrado.";
    td.style.textAlign = "center";
    td.style.color = "#64748b";
    td.style.padding = "20px";

    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }

  lista.forEach(function(usuario) {
    var tr = document.createElement("tr");

    tr.appendChild(criarCelulaUsuario(usuario.email || "-"));
    tr.appendChild(criarCelulaUsuario(usuario.nome || "-"));

    var tdPerfil = criarCelulaUsuario("");
    var selectPerfil = document.createElement("select");
    selectPerfil.className = "usuario-perfil-select";
    selectPerfil.style.width = "100%";
    selectPerfil.style.padding = "6px 8px";
    selectPerfil.style.borderRadius = "8px";
    selectPerfil.style.border = "1px solid #cbd5e1";
    selectPerfil.style.background = "#ffffff";
    selectPerfil.style.fontSize = "13px";

    var perfis = [
      { valor: "GESTOR_SISTEMA", rotulo: "Gestor do Sistema" },
      { valor: "GESTOR_CONTEUDO", rotulo: "Gestor de Conteúdo" },
      { valor: "USUARIO_CONSULTA", rotulo: "Visitante (remover acesso)" }
    ];

    perfis.forEach(function(opcao) {
      var option = document.createElement("option");
      option.value = opcao.valor;
      option.textContent = opcao.rotulo;
      selectPerfil.appendChild(option);
    });

    selectPerfil.value =
      ["GESTOR_SISTEMA", "GESTOR_CONTEUDO", "USUARIO_CONSULTA"].includes(
        String(usuario.perfil || "").toUpperCase()
      )
        ? String(usuario.perfil).toUpperCase()
        : "USUARIO_CONSULTA";

    tdPerfil.appendChild(selectPerfil);
    tr.appendChild(tdPerfil);

    var tdComarcas = criarCelulaUsuario("");

    var seletorComarcas = criarSeletorComarcas(usuario.comarcas || "");

    tdComarcas.appendChild(seletorComarcas.elemento);
    tr.appendChild(tdComarcas);

    var tdAtivo = criarCelulaUsuario("");
    tdAtivo.style.textAlign = "center";

    var checkboxAtivo = document.createElement("input");
    checkboxAtivo.type = "checkbox";
    checkboxAtivo.checked = usuario.ativo === true;
    checkboxAtivo.className = "usuario-ativo-checkbox";

    tdAtivo.appendChild(checkboxAtivo);
    tr.appendChild(tdAtivo);

    var tdAcoes = criarCelulaUsuario("");
    tdAcoes.style.textAlign = "center";
    tdAcoes.style.whiteSpace = "nowrap";

    var botaoSalvar = document.createElement("button");
    botaoSalvar.type = "button";
    botaoSalvar.className = "btn btn-primary";
    botaoSalvar.textContent = "💾 Salvar";
    botaoSalvar.style.padding = "5px 12px";
    botaoSalvar.style.fontSize = "12px";

    botaoSalvar.addEventListener("click", function() {
      salvarUsuario(
        usuario.email,
        selectPerfil.value,
        checkboxAtivo.checked,
        seletorComarcas.obterValor(),
        botaoSalvar
      );
    });

    tdAcoes.appendChild(botaoSalvar);
    tr.appendChild(tdAcoes);

    tbody.appendChild(tr);
  });
}

function criarCelulaUsuario(valor) {
  var td = document.createElement("td");

  td.textContent =
    valor === null || valor === undefined || String(valor).trim() === ""
      ? "-"
      : String(valor);

  td.style.fontSize = "13px";

  return td;
}

function salvarUsuario(email, perfil, ativo, comarcas, botao) {
  if (
    !confirm(
      "Salvar alterações para " + email + "?\n\n" +
      "Perfil: " + perfil + "\n" +
      "Ativo: " + (ativo ? "SIM" : "NÃO") + "\n" +
      "Comarcas: " + (String(comarcas || "").trim() || "Todas")
    )
  ) {
    return;
  }

  var textoOriginal = botao.textContent;
  botao.disabled = true;
  botao.textContent = "Salvando...";

  API.atualizarUsuario(
    email,
    {
      perfil: perfil,
      ativo: ativo,
      comarcas: comarcas
    },
    function(resposta) {
      botao.disabled = false;
      botao.textContent = textoOriginal;

      if (!resposta || resposta.sucesso !== true) {
        mostrarToast(
          (resposta && resposta.erro) || "Erro ao salvar usuário.",
          "error"
        );
        return;
      }

      mostrarToast("Usuário atualizado com sucesso!", "success");

      if (perfil === "USUARIO_CONSULTA") {
        mostrarToast("Acesso removido — o usuário saiu da lista.", "info");
      }

      carregarUsuarios();
    },
    function(erro) {
      botao.disabled = false;
      botao.textContent = textoOriginal;

      mostrarToast(
        (erro && erro.message) || "Falha de comunicação com o servidor.",
        "error"
      );
    }
  );
}
</script>

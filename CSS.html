<!--
==========================================================
SISTEMA DE TELEFONES TJES
Arquivo: CSS.html
==========================================================
-->

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100vh;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6fa;
  color:#1f2937
}

body{min-width:0}
.hidden{display:none!important}

#app,.app-container{
  display:flex;
  width:100%;
  height:100vh;
  margin:0;
  padding:0;
  overflow:hidden
}

#sidebar-container{flex:0 0 auto}

.main-container,.main-content{
  flex:1 1 auto;
  width:calc(100% - 260px);
  max-width:100%;
  height:100vh;
  min-width:0;
  padding:25px;
  overflow-y:auto;
  overflow-x:hidden
}

.sidebar{
  width:260px;
  min-width:260px;
  height:100vh;
  flex-shrink:0;
  overflow-y:auto;
  background:#1e293b;
  color:#fff;
  display:flex;
  flex-direction:column
}

.sidebar-header{
  padding:25px;
  border-bottom:1px solid rgba(255,255,255,.1)
}

.sidebar-header h2{margin:0;font-size:28px}
.sidebar-header span{font-size:14px;opacity:.7}
.sidebar-menu{padding:15px;flex:1}

.menu-item{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  padding:12px 15px;
  margin-bottom:5px;
  text-align:left;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:10px
}

.menu-item:hover,.menu-item.active{
  background:rgba(255,255,255,.15)
}

.sidebar-footer{
  padding:16px;
  border-top:1px solid rgba(255,255,255,.1)
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:20px;
  width:100%
}

.system-title{min-width:0}

.system-title h1{
  margin:0;
  font-size:24px;
  line-height:1.25
}

.user-info{
  flex:0 0 auto;
  font-size:14px;
  color:#64748b
}

.dashboard-container,.telefones-container{
  width:100%;
  max-width:100%
}

.card,.panel,.search-panel,.table-panel{
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.card{width:100%;padding:20px}
.card-title{color:#64748b;font-size:14px}

.card-value{
  margin-top:10px;
  font-size:32px;
  font-weight:700
}

.dashboard-cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  width:100%
}

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  margin-top:20px;
  width:100%
}

.panel{width:100%;padding:20px}

.search-panel{
  width:100%;
  padding:16px;
  margin-bottom:12px
}

.search-box{position:relative}

.search-box .search-icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  z-index:2;
  font-size:15px;
  line-height:1;
  pointer-events:none
}

.search-box input{
  width:100%;
  height:38px;
  padding:9px 12px 9px 36px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:14px
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:15px;
  width:100%
}

.filter-group{
  flex:1 1 160px;
  min-width:160px
}

.filters select,.filter-group select{
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:14px;
  background:#fff
}

.table-panel{
  width:100%;
  padding:20px;
  overflow-x:auto
}

.data-table{
  width:100%;
  border-collapse:collapse
}

.data-table th{
  padding:12px;
  background:#f1f5f9;
  text-align:left;
  font-weight:600;
  color:#475569;
  white-space:nowrap
}

.data-table td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  vertical-align:middle
}

.data-table tbody tr:hover{background:#f1f5f9}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 16px;
  border:1px solid transparent;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  transition:.2s
}

.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{
  cursor:wait;
  opacity:.7;
  transform:none
}

.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}

.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}

.btn-secondary{background:#64748b;color:#fff}
.btn-secondary:hover{background:#475569}

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.45)
}

.modal-content{
  width:700px;
  max-width:100%;
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  background:#fff;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.2)
}

.modal-small{width:400px}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:20px;
  border-bottom:1px solid #e5e7eb
}

.modal-header h2{margin:0;font-size:20px}
.modal-body{padding:20px}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:10px;
  padding:12px 20px;
  border-top:1px solid #e5e7eb
}

.modal-close{
  border:0;
  background:transparent;
  color:#64748b;
  font-size:25px;
  cursor:pointer
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px
}

.form-group{
  display:flex;
  flex-direction:column;
  min-width:0
}

.form-group.full{grid-column:span 2}
.form-group label{font-weight:600}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  margin-top:5px;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font:inherit
}

.form-group textarea{
  min-height:90px;
  resize:vertical
}

.modal-alert{
  max-width:380px;
  padding:8px 12px;
  border:1px solid #f5c2c7;
  border-radius:6px;
  background:#f8d7da;
  color:#842029;
  font-size:13px;
  line-height:1.3
}

.toast-container{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:2000;
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:min(420px,calc(100vw - 40px))
}

.toast{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:13px 16px;
  border-left:5px solid #64748b;
  border-radius:8px;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  color:#1f2937;
  font-size:14px
}

.toast.success{border-left-color:#16a34a}
.toast.error{border-left-color:#dc2626}
.toast.warning{border-left-color:#f59e0b}
.toast.info{border-left-color:#2563eb}

:root{
  --bg:#f5f6fa;
  --bg-panel:#fff;
  --text:#1f2937;
  --text-secondary:#64748b
}

.dark-mode{
  --bg:#0f172a;
  --bg-panel:#1e293b;
  --text:#f1f5f9;
  --text-secondary:#94a3b8
}

body{
  background:var(--bg);
  color:var(--text)
}

.panel,.card,.search-panel,.table-panel{
  background:var(--bg-panel)
}

/* ==========================================================
   MODO ESCURO
   ========================================================== */

.dark-mode .panel,
.dark-mode .card,
.dark-mode .search-panel,
.dark-mode .table-panel,
.dark-mode .mapa-panel,
.dark-mode .detalhe-contatos-panel{
  background:#1e293b;
  color:#f1f5f9;
}

.dark-mode .topbar,
.dark-mode .telefones-instrucao,
.dark-mode .consulta-lista-titulo,
.dark-mode .consulta-microrregiao label,
.dark-mode .card-title,
.dark-mode .user-info,
.dark-mode .registro-vazio{
  color:#cbd5e1;
}

.dark-mode .system-title h1,
.dark-mode .mapa-header h3,
.dark-mode .detalhe-contatos-cabecalho h3,
.dark-mode .detalhe-contatos-cabecalho h4,
.dark-mode .contato-titulo,
.dark-mode .comarca-nome{
  color:#f8fafc;
}

.dark-mode .consulta-microrregiao select,
.dark-mode .search-box input{
  background:#0f172a;
  color:#f1f5f9;
  border-color:#475569;
}

.dark-mode .comarca-item{
  background:#1e293b!important;
  border-color:#475569!important;
}

.dark-mode .comarca-item:hover{
  background:#334155!important;
}

.dark-mode .setor-item{
  color:#cbd5e1;
  border-color:#475569;
}

.dark-mode .setor-item:hover{
  background:#334155;
}

.dark-mode .contato-bloco{
  background:#0f172a;
  border-color:#475569;
}

.dark-mode .contato-vazio{
  color:#94a3b8;
}

.dark-mode .data-table th{
  background:#334155;
  color:#f8fafc;
}

.dark-mode .data-table td{
  border-color:#475569;
  color:#e2e8f0;
}

.dark-mode .data-table tbody tr:hover{
  background:#334155;
}

.dark-mode .mapa-area,
.dark-mode .mapa-overlay-area{
  background:#0f172a;
}

.dark-mode .configuracoes-panel hr{
  border-color:#475569!important;
}

/* ==========================================================
   CONFIGURAÇÕES
   ========================================================== */

.configuracoes-panel{
  padding:22px;
}

.configuracao-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.configuracao-item strong{
  display:block;
  font-size:15px;
}

.configuracao-item p{
  margin:5px 0 0;
  color:var(--text-secondary);
  font-size:13px;
}

.configuracao-sistema h3{
  margin:0 0 18px;
  font-size:17px;
}

.configuracao-sistema p{
  margin:10px 0;
}

/* ==========================================================
   SWITCH
   ========================================================== */

.switch{
  position:relative;
  display:inline-block;
  width:48px;
  height:26px;
  flex:0 0 auto;
}

.switch input{
  width:0;
  height:0;
  opacity:0;
}

.slider{
  position:absolute;
  inset:0;
  cursor:pointer;
  background:#cbd5e1;
  border-radius:999px;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.switch input:checked + .slider{
  background:#2563eb;
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}

/* ==========================================================
   CONSULTA PÚBLICA
   ========================================================== */

.telefones-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:14px
}

.telefones-instrucao{
  margin:0;
  color:#475569;
  font-size:14px
}

.consulta-layout{
  display:grid;
  grid-template-columns:minmax(340px,38%) minmax(0,1fr);
  gap:16px;
  height:calc(100vh - 185px);
  min-height:520px
}

.consulta-esquerda{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0
}

.consulta-filtros{flex:none}
.consulta-microrregiao{margin-top:12px}

.consulta-microrregiao label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:600;
  color:#334155
}

.consulta-microrregiao select{
  width:100%;
  padding:10px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  color:#0f172a;
  font-size:14px
}

.consulta-lista-wrapper{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden
}

.consulta-lista-titulo{
  flex:none;
  padding:8px 4px;
  color:#475569;
  font-size:13px;
  font-weight:600
}

.consulta-lista{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:2px 3px 4px 0
}

.consulta-lista-vazio{
  padding:18px;
  text-align:center;
  color:#64748b
}

.consulta-detalhes{
  min-width:0;
  min-height:0;
  height:100%
}

#consulta-mapa{
  width:100%;
  height:100%
}

.mapa-panel{
  height:100%;
  display:flex;
  flex-direction:column;
  padding:18px;
  overflow:hidden;
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.mapa-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  margin-bottom:12px;
  flex:none
}

.mapa-header h3{
  margin:0 0 4px;
  color:#0f172a;
  font-size:20px
}

.mapa-header p{
  margin:0;
  color:#64748b;
  font-size:13px
}

.btn-mapa{
  border:0;
  background:none;
  color:#2563eb;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
  padding:4px 0
}

.btn-mapa:hover{text-decoration:underline}

.mapa-area{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:10px;
  background:#f8fafc
}

.mapa-area img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center
}

#consulta-detalhes-conteudo{
  height:100%;
  overflow:auto
}

/* ==========================================================
   MAPA EM OVERLAY
   ========================================================== */

body.mapa-aberto{
  overflow:hidden!important
}

.mapa-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(15,23,42,.78);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px)
}

.mapa-overlay.ativo{display:flex}

.mapa-overlay-painel{
  width:min(97vw,1700px);
  height:min(96vh,1150px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#fff;
  border-radius:14px;
  box-shadow:0 20px 70px rgba(0,0,0,.4)
}

.mapa-overlay-header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:14px 18px;
  border-bottom:1px solid #e2e8f0;
  background:#fff
}

.mapa-overlay-header h3{
  margin:0;
  color:#0f172a;
  font-size:21px
}

.mapa-overlay-area{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:8px;
  background:#f8fafc
}

.mapa-overlay-area img{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:100%;
  object-fit:contain
}

.mapa-overlay .btn{
  flex:0 0 auto;
  white-space:nowrap
}

/* ==========================================================
   COMARCAS / SETORES
   ========================================================== */

.comarca-item{
  display:flex!important;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 11px!important;
  margin-bottom:4px!important;
  border:1px solid #e2e8f0!important;
  border-radius:8px!important;
  background:#fff!important;
  cursor:pointer;
  transition:.15s
}

.comarca-item:hover{
  background:#f8fafc!important;
  border-color:#cbd5e1!important
}

.comarca-nome{
  font-size:14px;
  font-weight:600;
  color:#0f172a
}

.setor-count{
  flex:none;
  color:#64748b;
  font-size:12px
}

.setores-list{
  margin:0 0 6px 10px!important
}

.setor-item{
  padding:7px 9px!important;
  border-bottom:1px solid #e2e8f0;
  color:#334155;
  font-size:13px;
  cursor:pointer
}

.setor-item:hover{
  background:#f1f5f9
}

/* ==========================================================
   DETALHES DOS CONTATOS
   ========================================================== */

.detalhe-contatos-panel{
  height:100%;
  overflow:auto
}

.detalhe-contatos-cabecalho{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  margin-bottom:16px
}

.detalhe-contatos-cabecalho h3{
  margin:0 0 4px
}

.detalhe-contatos-cabecalho h4{
  margin:0;
  color:#475569
}

.contatos-publicos{
  display:flex;
  flex-direction:column;
  gap:12px
}

.contato-bloco{
  padding:12px 14px;
  border:1px solid #e2e8f0;
  border-radius:9px;
  background:#f8fafc
}

.contato-titulo{
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
  color:#334155
}

.contato-lista{
  display:flex;
  flex-direction:column;
  gap:4px
}

.contato-item,
.contato-item-link,
.contato-vazio{
  font-size:14px;
  line-height:1.45;
  word-break:break-word
}

.contato-vazio{color:#64748b}
.contato-item-link{text-decoration:none}
.contato-item-link.telefone{color:#1d4ed8}

.contato-item-link.whatsapp{
  color:#15803d;
  font-weight:600
}

.contato-item-link.email{color:#2563eb}
.contato-item-link:hover{text-decoration:underline}

/* ==========================================================
   RESPONSIVIDADE
   ========================================================== */

@media(max-width:1000px){
  .consulta-layout{
    grid-template-columns:1fr;
    height:auto;
    min-height:0
  }

  .consulta-lista{max-height:40vh}

  .consulta-detalhes{
    height:65vh;
    min-height:500px
  }
}

@media(max-width:900px){
  .sidebar{
    width:80px;
    min-width:80px
  }

  .main-container,.main-content{
    width:calc(100% - 80px);
    padding:18px
  }

  .sidebar-header{
    padding:18px 10px;
    text-align:center
  }

  .sidebar-header h2{font-size:22px}

  .sidebar-header span,
  .menu-item span:not(.icon){
    display:none
  }

  .menu-item{
    justify-content:center;
    padding:12px 8px
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start
  }

  .system-title h1{font-size:19px}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:span 1}

  .modal-footer{
    flex-direction:column;
    align-items:stretch
  }

  .modal-footer>div{width:100%}
}

@media(max-width:760px){
  .mapa-overlay{padding:8px}

  .mapa-overlay-painel{
    width:100%;
    height:97vh;
    border-radius:10px
  }

  .mapa-overlay-header{
    padding:11px 12px
  }

  .mapa-overlay-header h3{font-size:17px}

  .mapa-overlay-area{padding:4px}
}

/* ==========================================================
   IMPRESSÃO
   ========================================================== */

@media print{
  @page{
    size:A4 portrait;
    margin:25mm 12mm 15mm 12mm;
  }

  html,body{
    width:100%;
    height:auto!important;
    margin:0!important;
    padding:0!important;
    overflow:visible!important;
    background:#fff!important;
  }

  body *{
    visibility:hidden!important;
  }

  /* ========================================================
     CONSULTA DE TELEFONES
     ======================================================== */

  #consulta-detalhes-conteudo,
  #consulta-detalhes-conteudo *{
    visibility:visible!important;
  }

  #consulta-detalhes-conteudo{
    display:block!important;
    position:absolute!important;
    top:0!important;
    left:0!important;
    width:100%!important;
    height:auto!important;
    overflow:visible!important;
    margin:0!important;
    padding:0!important;
    background:#fff!important;
    color:#000!important;
  }

  /* ==========================================================
   REGISTRO DE ALTERAÇÕES
   ========================================================== */

  .registro-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    width:100%;
    margin:0 0 15px;
  }

  .registro-header h2{
    margin:0;
    font-size:22px;
  }

  .registro-tabela-panel{
    width:100%;
    margin-top:0;
  }

  .registro-vazio{
